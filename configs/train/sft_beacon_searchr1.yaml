# Search-R1；Qwen3 暂停线性记忆、readout 蒸馏、子文档和窗口切分。
model_name_or_path: Qwen/Qwen3-4B-Thinking-2507
train_data_path: outputs/data/searchr1/qwen2.5-7b-instruct-sft.jsonl
val_data_path: null
max_length: 8192
data_mode: searchr1
per_device_batch_size: 1
grad_accum_steps: 8
learning_rate: 5.0e-05
weight_decay: 0.01
num_epochs: 1
warmup_ratio: 0.05
max_steps: null
freeze_llm: false
gradient_checkpointing: true
use_bf16: true
exp_name: beacon_sft_searchr1_v1
output_dir: outputs
save_freq_steps: 500
log_freq_steps: 5
seed: 42
beacon:
  enable_beacon: true
  beacon_ratio: 32
  beacon_param: q k v
  beacon_embed_init: eos
  beacon_pos: append
  beacon_attn: full-coverage
  beacon_information_mode: whole
  beacon_window_enabled: false
  beacon_doc_region_split: false
  beacon_question_memory_v1: false
  beacon_readout_distill_weight: 0.0
  beacon_keep_window: 1024
