# 无压缩、全参数 SFT 对照组；完整轨迹不截断。
data_mode: searchr1
model_name_or_path: Qwen/Qwen3.5-4B
train_data_path: outputs/data/searchr1/qwen3-4b-instruct-sft.jsonl
val_data_path: null
max_length: 8192  # 兼容字段，不截断轨迹
per_device_batch_size: 1
grad_accum_steps: 8
learning_rate: 5.0e-05
weight_decay: 0.01
lr_scheduler_type: constant
warmup_ratio: 0.0
max_grad_norm: 1.0
num_epochs: 1
max_train_steps: null
use_bf16: true
optim: adamw_torch
gradient_checkpointing: true
save_freq_steps: 1000
log_freq_steps: 5
eval_steps: 1000
seed: 42
use_lora: false
exp_name: qwen35_plain_full_sft
output_dir: outputs
